{% extends "base.html" %}
{% block title %}Регистрация - Spotify Analytics{% endblock %}
{% block content %}
<script>
    document.body.classList.add('no-scroll');
</script>
<style>
    .auth-container {
        height: 100vh;
        max-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        position: relative;
        overflow: hidden;
    }

    .auth-container::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 100%;
        height: 100%;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, rgba(29, 185, 84, 0.15) 0%, transparent 70%);
        animation: pulse 15s ease-in-out infinite;
        z-index: 0;
    }

    @keyframes pulse {

        0%,
        100% {
            transform: translate(-50%, -50%) scale(1) rotate(0deg);
            opacity: 0.5;
        }

        50% {
            transform: translate(-50%, -50%) scale(1.15) rotate(180deg);
            opacity: 0.8;
        }
    }

    .auth-card {
        background: linear-gradient(135deg, rgba(40, 40, 40, 0.95) 0%, rgba(30, 30, 30, 0.98) 100%);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 24px;
        padding: 60px 50px;
        max-width: 600px;
        width: 100%;
        min-height: 500px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
        position: relative;
        z-index: 1;
        border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .auth-header {
        text-align: center;
        margin-bottom: 40px;
    }

    .auth-header h2 {
        font-size: 2em;
        font-weight: 800;
        background: linear-gradient(135deg, #1DB954 0%, #1ed760 50%, #00f2fe 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 8px;
        letter-spacing: -0.5px;
    }

    .auth-header p {
        color: var(--text-gray);
        font-size: 0.95em;
        margin: 0;
    }

    .form-group {
        position: relative;
        margin-bottom: 28px;
    }

    .form-input {
        width: 100%;
        padding: 16px 20px;
        background: rgba(255, 255, 255, 0.05);
        border: 2px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        color: white;
        font-size: 1em;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        outline: none;
        font-family: inherit;
    }

    .form-input:focus {
        border-color: #1DB954;
        background: rgba(255, 255, 255, 0.08);
        box-shadow: 0 0 0 4px rgba(29, 185, 84, 0.1), 0 4px 12px rgba(0, 0, 0, 0.3);
        transform: translateY(-2px);
    }

    .form-input::placeholder {
        color: rgba(255, 255, 255, 0.4);
    }

    .form-label {
        display: block;
        color: var(--text-gray);
        font-weight: 600;
        margin-bottom: 10px;
        font-size: 0.9em;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .auth-btn {
        width: 100%;
        padding: 16px;
        background: linear-gradient(135deg, #1DB954 0%, #1ed760 100%);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 1.05em;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 4px 15px rgba(29, 185, 84, 0.3);
        position: relative;
        overflow: hidden;
    }

    .auth-btn::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.3);
        transform: translate(-50%, -50%);
        transition: width 0.6s ease, height 0.6s ease;
    }

    .auth-btn:hover {
        background: linear-gradient(135deg, #1ed760 0%, #00f2fe 100%);
        transform: translateY(-2px);
        box-shadow: 0 6px 25px rgba(29, 185, 84, 0.5);
    }

    .auth-btn:hover::before {
        width: 300px;
        height: 300px;
    }

    .auth-btn:active {
        transform: translateY(0);
    }

    .auth-footer {
        text-align: center;
        margin-top: 32px;
        padding-top: 32px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .auth-footer p {
        color: var(--text-gray);
        margin: 0;
    }

    .auth-footer a {
        color: #1DB954;
        font-weight: 600;
        text-decoration: none;
        transition: all 0.3s ease;
        position: relative;
    }

    .auth-footer a::after {
        content: '';
        position: absolute;
        bottom: -2px;
        left: 0;
        width: 0;
        height: 2px;
        background: linear-gradient(90deg, #1DB954 0%, #1ed760 100%);
        transition: width 0.3s ease;
    }

    .auth-footer a:hover {
        color: #1ed760;
    }

    .auth-footer a:hover::after {
        width: 100%;
    }
</style>

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h2>Создать аккаунт</h2>
            <p>Присоединяйтесь к нам</p>
        </div>

        <form action="/register" method="POST">
            <div class="form-group">
                <label class="form-label" for="username">Логин</label>
                <input type="text" id="username" name="username" class="form-input"
                    placeholder="Придумайте уникальный логин" required autocomplete="username">
            </div>

            <div class="form-group">
                <label class="form-label" for="display_name">Отображаемое имя</label>
                <input type="text" id="display_name" name="display_name" class="form-input"
                    placeholder="Как вас будут видеть другие" required autocomplete="name">
            </div>

            <div class="form-group">
                <label class="form-label" for="email">Email</label>
                <input type="email" id="email" name="email" class="form-input" placeholder="your.email@example.com"
                    required autocomplete="email">
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Пароль</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="Минимум 6 символов"
                    required autocomplete="new-password" minlength="6">
            </div>

            <button type="submit" class="auth-btn">Зарегистрироваться</button>
        </form>

        <div class="auth-footer">
            <p>Уже есть аккаунт? <a href="/login-local">Войти</a></p>
        </div>
    </div>
</div>
{% endblock %}
