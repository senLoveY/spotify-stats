{% extends "base.html" %}
{% block title %}Подтверждение кода - Spotify Analytics{% endblock %}
{% block content %}
<script>
    document.body.classList.add('no-scroll');
</script>
<style>
    .auth-container {
        height: 100vh;
        max-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        position: relative;
        overflow: hidden;
    }

    .auth-container::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 100%;
        height: 100%;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, rgba(29, 185, 84, 0.15) 0%, transparent 70%);
        animation: pulse 15s ease-in-out infinite;
        z-index: 0;
    }

    @keyframes pulse {

        0%,
        100% {
            transform: translate(-50%, -50%) scale(1) rotate(0deg);
            opacity: 0.5;
        }

        50% {
            transform: translate(-50%, -50%) scale(1.15) rotate(180deg);
            opacity: 0.8;
        }
    }

    .auth-card {
        background: linear-gradient(135deg, rgba(40, 40, 40, 0.95) 0%, rgba(30, 30, 30, 0.98) 100%);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 24px;
        padding: 60px 50px;
        max-width: 600px;
        width: 100%;
        min-height: 500px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
        position: relative;
        z-index: 1;
        border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .auth-header {
        text-align: center;
        margin-bottom: 40px;
    }

    .auth-header h2 {
        font-size: 2em;
        font-weight: 800;
        background: linear-gradient(135deg, #1DB954 0%, #1ed760 50%, #00f2fe 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 8px;
        letter-spacing: -0.5px;
    }

    .auth-header p {
        color: var(--text-gray);
        font-size: 0.95em;
        margin: 0;
    }

    .code-input-group {
        display: flex;
        gap: 12px;
        justify-content: center;
        margin-bottom: 28px;
    }

    .code-input {
        width: 100%;
        max-width: 400px;
        height: 70px;
        text-align: center;
        font-size: 2em;
        font-weight: 700;
        background: rgba(255, 255, 255, 0.05);
        border: 2px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        color: white;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        outline: none;
        font-family: 'Courier New', monospace;
        padding: 0 20px;
        letter-spacing: 8px;
    }

    .code-input::placeholder {
        font-size: 0.5em;
        letter-spacing: 2px;
        opacity: 0.6;
    }

    .code-input:focus {
        border-color: #1DB954;
        background: rgba(255, 255, 255, 0.08);
        box-shadow: 0 0 0 4px rgba(29, 185, 84, 0.1), 0 4px 12px rgba(0, 0, 0, 0.3);
        transform: scale(1.05);
    }

    .auth-btn {
        width: 100%;
        padding: 16px;
        background: linear-gradient(135deg, #1DB954 0%, #1ed760 100%);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 1.05em;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 4px 15px rgba(29, 185, 84, 0.3);
        position: relative;
        overflow: hidden;
        margin-bottom: 20px;
    }

    .auth-btn::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.3);
        transform: translate(-50%, -50%);
        transition: width 0.6s ease, height 0.6s ease;
    }

    .auth-btn:hover {
        background: linear-gradient(135deg, #1ed760 0%, #00f2fe 100%);
        transform: translateY(-2px);
        box-shadow: 0 6px 25px rgba(29, 185, 84, 0.5);
    }

    .auth-btn:hover::before {
        width: 300px;
        height: 300px;
    }

    .resend-link {
        text-align: center;
        margin-top: 20px;
    }

    .resend-link a {
        color: #1DB954;
        font-weight: 600;
        text-decoration: none;
        transition: all 0.3s ease;
        position: relative;
        cursor: pointer;
    }

    .resend-link a::after {
        content: '';
        position: absolute;
        bottom: -2px;
        left: 0;
        width: 0;
        height: 2px;
        background: linear-gradient(90deg, #1DB954 0%, #1ed760 100%);
        transition: width 0.3s ease;
    }

    .resend-link a:hover {
        color: #1ed760;
    }

    .resend-link a:hover::after {
        width: 100%;
    }

    .email-info {
        text-align: center;
        color: var(--text-gray);
        margin-bottom: 30px;
        font-size: 0.9em;
    }
</style>

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h2>Подтверждение</h2>
            <p>Введите код из письма</p>
        </div>

        <div class="email-info">
            Код отправлен на: <strong>{{ email }}</strong>
        </div>

        <form action="/verify-code" method="POST" id="verifyForm">
            <div class="code-input-group">
                <input type="text" name="code" class="code-input" maxlength="6" pattern="[0-9]{6}"
                    placeholder="Введите 6-значный код" required autocomplete="off" id="codeInput">
            </div>

            <button type="submit" class="auth-btn">Подтвердить</button>
        </form>

        <div class="resend-link">
            <a href="#" onclick="resendCode(event)">Отправить код повторно</a>
        </div>
    </div>
</div>

<script>
    const codeInput = document.getElementById('codeInput');

    // Автоматический переход на следующее поле (если бы было несколько)
    codeInput.addEventListener('input', function (e) {
        this.value = this.value.replace(/[^0-9]/g, '');
        if (this.value.length === 6) {
            document.getElementById('verifyForm').submit();
        }
    });

    function resendCode(e) {
        e.preventDefault();
        fetch('/resend-code', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            }
        })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('Код отправлен повторно!');
                } else {
                    alert('Ошибка: ' + data.message);
                }
            })
            .catch(error => {
                alert('Ошибка отправки запроса');
            });
    }
</script>
{% endblock %}
