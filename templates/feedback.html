{% extends "base.html" %}

{% block title %}Обратная связь{% endblock %}

{% block content %}
<div class="container" style="max-width: 800px; margin: 40px auto; padding: 0 20px;">
    <h1 style="background: linear-gradient(135deg, #1DB954 0%, #1ed760 100%);
               -webkit-background-clip: text;
               -webkit-text-fill-color: transparent;
               background-clip: text;
               font-size: 2.5em;
               margin-bottom: 30px;
               text-align: center;">Обратная связь</h1>

    <div class="card" style="padding: 30px;">
        <p style="color: #B3B3B3; margin-bottom: 25px; text-align: center;">
            Мы ценим ваше мнение! Поделитесь своими мыслями, сообщите об ошибке или предложите новую функцию.
        </p>

        <form method="POST" action="/feedback" style="display: grid; gap: 20px;">
            <div>
                <label for="feedback_type" style="display: block; color: #ccc; margin-bottom: 8px; font-weight: 600;">
                    Тип обратной связи <span style="color: #e91429;">*</span>
                </label>
                <select id="feedback_type" name="feedback_type" required style="width: 100%; 
                           padding: 12px 15px; 
                           background: rgba(255, 255, 255, 0.1); 
                           border: 1px solid rgba(255, 255, 255, 0.2); 
                           border-radius: 8px; 
                           color: white; 
                           font-size: 1em;
                           cursor: pointer;">
                    <option value="">Выберите тип...</option>
                    <option value="bug">Сообщить об ошибке</option>
                    <option value="feature_request">Запрос функции</option>
                    <option value="complaint">Жалоба</option>
                    <option value="praise">Благодарность</option>
                    <option value="other">Другое</option>
                </select>
            </div>

            <div>
                <label for="title" style="display: block; color: #ccc; margin-bottom: 8px; font-weight: 600;">
                    Заголовок <span style="color: #e91429;">*</span>
                </label>
                <input type="text" id="title" name="title" required maxlength="255"
                    placeholder="Краткое описание проблемы или предложения" style="width: 100%; 
                           padding: 12px 15px; 
                           background: rgba(255, 255, 255, 0.1); 
                           border: 1px solid rgba(255, 255, 255, 0.2); 
                           border-radius: 8px; 
                           color: white; 
                           font-size: 1em;">
            </div>

            <div>
                <label for="message" style="display: block; color: #ccc; margin-bottom: 8px; font-weight: 600;">
                    Сообщение <span style="color: #e91429;">*</span>
                </label>
                <textarea id="message" name="message" required rows="8"
                    placeholder="Опишите подробно вашу проблему, предложение или отзыв..." style="width: 100%; 
                           padding: 12px 15px; 
                           background: rgba(255, 255, 255, 0.1); 
                           border: 1px solid rgba(255, 255, 255, 0.2); 
                           border-radius: 8px; 
                           color: white; 
                           font-size: 1em;
                           resize: vertical;
                           font-family: inherit;"></textarea>
            </div>

            <input type="hidden" name="page_url" id="page_url" value="{{ request.referrer or '' }}">

            <button type="submit" class="btn" style="background: linear-gradient(135deg, #1DB954 0%, #1ed760 100%); 
                           border: none; 
                           color: white; 
                           padding: 14px 30px; 
                           border-radius: 25px; 
                           cursor: pointer; 
                           font-weight: 600; 
                           transition: all 0.3s;
                           justify-self: center;
                           font-size: 1.1em;">
                Отправить обратную связь
            </button>
        </form>
    </div>
</div>

<script>
    // Автоматически заполняем page_url текущей страницей
    document.getElementById('page_url').value = window.location.href;
</script>
{% endblock %}
